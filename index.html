<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Kasse">
<meta name="theme-color" content="#262d2f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Weihnachtsmarkt-Kasse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, quick, nothing in the way – a till you can use with cold fingers.
   IDEA: the stand's own chalkboard menu turned into buttons.
   PICTURE: the tile board itself plus a big chalk total.
   COLOUR and TYPE: chalkboard #22282a, chalk white, mulled-wine red accent, pine green support, gold prices; Patrick Hand + Nunito.
   LAYOUT: iPad landscape = tiles left, receipt right; phone = stacked with sticky total bar. */
:root{color-scheme:dark;--bg:#1d2224;--board:#262d2f;--tile:#313a3c;--tile2:#3a4547;--ink:#f3f1ea;--mut:#a9b2ad;--line:#46514f;--red:#c9402f;--red2:#e0573f;--pine:#2f6b4f;--pine2:#3d8a66;--gold:#f0c35a}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Nunito,system-ui,sans-serif;overflow-x:clip;-webkit-user-select:none;user-select:none;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
input,select,textarea{-webkit-user-select:text;user-select:text}
h1,h2,.hand{font-family:"Patrick Hand",Nunito,cursive;font-weight:400}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
header{display:flex;align-items:center;gap:12px;padding:max(10px,env(safe-area-inset-top)) max(2vw,12px) 10px;background:var(--board);border-bottom:2px dashed var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{margin:0;font-size:30px;line-height:1;flex:1 1 auto}
header h1 span{color:var(--gold)}
nav{display:flex;gap:6px}
nav button,.btn{font:inherit;font-weight:700;border:0;border-radius:12px;min-height:44px;padding:0 16px;background:var(--tile);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
nav button[aria-current=true]{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label.btn:focus-within{outline:3px solid var(--gold);outline-offset:2px}
.sync{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px}
.sync i{width:10px;height:10px;border-radius:50%;background:var(--mut);display:inline-block}
.sync.ok i{background:var(--pine2)}.sync.warn i{background:var(--gold)}
main{padding:12px max(2vw,12px) 24px}
.view{display:none}.view.on{display:block}
.hint{display:flex;gap:12px;align-items:center;background:#3f3626;border:1px solid #6b5a36;border-radius:14px;padding:10px 12px;margin:0 0 12px;font-size:15px}
.hint p{margin:0;flex:1}.hint b{color:var(--gold)}
/* Kasse */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
.cat{margin:0 0 14px}
.cat h2{margin:4px 2px 8px;font-size:24px;color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;font:inherit;text-align:left;border:0;border-radius:16px;background:var(--tile);color:var(--ink);min-height:96px;padding:12px 12px 10px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;box-shadow:0 3px 0 #0006;transition:transform .06s}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 #0006;background:var(--tile2)}
.tile.heiss{background:#4a2723}.tile.heiss:active{background:#5b302b}
.tile.frei{background:#24443a}.tile.frei:active{background:#2c5347}
.tile.poff{background:#3f3626}.tile.poff:active{background:#4d4230}
.tile.herz{background:#45301f}.tile.herz:active{background:#553c27}
.tile b{font-size:17px;line-height:1.2;font-weight:800;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.tile .p{display:flex;justify-content:space-between;align-items:end;gap:6px;margin-top:8px}
.tile .p span:first-child{color:var(--gold);font-weight:800;font-size:18px}
.tile small{font-size:12px;color:var(--mut);white-space:nowrap}
.tile .p{flex-wrap:wrap;row-gap:2px}
.tile .q{position:absolute;top:-6px;right:-6px;min-width:30px;height:30px;border-radius:15px;background:var(--red2);color:#fff;font-weight:800;display:grid;place-items:center;padding:0 8px;box-shadow:0 2px 6px #0008}
.tile .warn{color:var(--gold);font-size:12px}
.ret{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.ret button{font:inherit;font-weight:800;border:2px dashed var(--pine2);background:transparent;color:var(--ink);border-radius:14px;min-height:60px;cursor:pointer;line-height:1.15;padding:6px}
.ret button:active{background:#2f6b4f55}
.ret small{display:block;font-weight:600;color:var(--mut);font-size:13px}
.cart{position:sticky;top:76px;background:var(--board);border-radius:18px;padding:14px;border:2px solid var(--line);max-height:calc(100vh - 92px);display:flex;flex-direction:column}
.lines{overflow:auto;flex:1 1 auto;min-height:60px;margin:0 -4px;padding:0 4px}
.empty{color:var(--mut);text-align:center;padding:26px 8px;font-size:15px}
.ln .x{width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--mut);font:800 18px Nunito;cursor:pointer}
.ln .x:active{background:#c9402f55;color:#fff}
.cbtn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cbtn .btn{background:transparent;border:1px solid var(--line);color:var(--ink)}
.cbtn .btn:disabled{opacity:.35}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto auto 36px;gap:6px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.ln .nm{font-weight:700;line-height:1.2}
.ln .nm small{display:block;color:var(--mut);font-weight:600}
.ln.pf .nm{color:var(--mut);font-weight:600}
.ln.back .nm{color:#9fe0bf}
.qc{display:flex;align-items:center;gap:4px}
.qc button{width:36px;height:36px;border-radius:10px;border:0;background:var(--tile);color:var(--ink);font:800 20px Nunito;cursor:pointer}
.qc span{min-width:22px;text-align:center;font-weight:800}
.sum{padding-top:10px;margin-top:6px;border-top:2px solid var(--ink)}
.sum .row{display:flex;justify-content:space-between;color:var(--mut);font-size:14px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 10px}
.total span:first-child{font-size:24px}
.total .num{font-family:"Patrick Hand";font-size:52px;line-height:1;color:var(--ink)}
.total.neg .num{color:#9fe0bf}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pay button{font:800 20px Nunito;border:0;border-radius:14px;min-height:64px;cursor:pointer;color:#fff}
.pay .bar{background:var(--pine)}.pay .karte{background:#3b5a8a}
.pay button:disabled{opacity:.35}
/* Modal */
.ov{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:20;padding:16px}
.ov.on{display:grid}
.modal{background:var(--board);border:2px solid var(--line);border-radius:22px;padding:20px;width:min(520px,100%)}
.modal h2{margin:0 0 4px;font-size:30px}
.big{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line)}
.big .num{font-family:"Patrick Hand";font-size:44px}
.big.rg .num{color:var(--gold);font-size:56px}
.notes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0}
.notes button{font:800 19px Nunito;min-height:58px;border-radius:12px;border:0;background:var(--tile2);color:var(--ink);cursor:pointer}
.notes .ex{grid-column:span 2;background:var(--pine)}
.mact{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.mact .go{background:var(--pine);color:#fff;font-size:20px;min-height:60px}
.cardamt{font-family:"Patrick Hand";font-size:clamp(64px,14vw,104px);line-height:1;text-align:center;padding:18px 0 22px;color:var(--gold);border-block:1px dashed var(--line);margin:8px 0 16px}
.cok{width:100%;min-height:72px;background:#3b5a8a;color:#fff;font-size:22px;margin-bottom:8px}
.mact2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* Toast */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(200%);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 18px;font-weight:800;display:flex;gap:14px;align-items:center;z-index:30;transition:transform .2s;max-width:calc(100% - 24px)}
.toast.on{transform:translateX(-50%) translateY(0)}
.toast button{background:var(--bg);color:var(--ink);min-height:40px}
.toast.plain button{display:none}
/* Auswertung */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chips button{font:inherit;font-weight:700;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:22px;min-height:44px;padding:0 16px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--board);border-radius:16px;padding:14px;border:1px solid var(--line)}
.kpi span{color:var(--mut);font-size:14px}
.kpi b{display:block;font-family:"Patrick Hand";font-weight:400;font-size:38px;line-height:1.05;margin-top:2px}
.kpi small{color:var(--mut);font-size:13px}
.kpi.hi{background:var(--pine);border-color:var(--pine)}.kpi.hi span,.kpi.hi small{color:#dff2e8}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
.card{background:var(--board);border-radius:16px;padding:14px;border:1px solid var(--line);margin-bottom:16px}
.card h2{margin:0 0 8px;font-size:26px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px dashed var(--line);vertical-align:middle}
th{color:var(--mut);font-weight:700;font-size:13px}
td.r,th.r{text-align:right}
.barw{height:8px;border-radius:4px;background:var(--red);margin-top:4px}
.void td{opacity:.4;text-decoration:line-through}
.sm{min-height:36px;padding:0 10px;font-size:14px;border-radius:10px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.danger{background:#5a2420}
.btn:disabled{opacity:.35;cursor:default}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
textarea{width:100%;min-height:72px;margin:10px 0 8px;font:14px/1.3 ui-monospace,Menlo,monospace;background:var(--tile);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;resize:vertical}
/* Ausgeben */
.fbanner{border:2px dashed var(--gold);background:#3f362633;color:var(--ink);border-radius:14px;padding:10px 14px;margin:0 0 12px;font-size:15px}
.fbanner b{color:var(--gold)}
body.mode-frei header{background:#3a3222}
body.mode-frei nav button[aria-current=true]{background:var(--gold);color:#1d2224}
.cart.free{border-color:var(--gold)}
.pft{display:flex;justify-content:space-between;align-items:center;width:100%;font:700 16px Nunito;min-height:48px;border-radius:12px;border:1px dashed var(--line);background:transparent;color:var(--ink);padding:0 14px;margin-bottom:8px;cursor:pointer}
.pft b{color:var(--mut)}.pft.on{border:1px solid var(--pine2);background:#2f6b4f44}.pft.on b{color:#9fe0bf}
.pfcash{display:flex;justify-content:space-between;align-items:baseline;gap:8px;background:var(--pine);border-radius:12px;padding:8px 12px;margin-bottom:6px;font-weight:700}
.pfcash .num{font-family:"Patrick Hand";font-size:30px}
.who-t{margin:2px 0 6px;color:var(--mut);font-size:14px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.who button{font:800 19px Nunito;border:0;border-radius:14px;min-height:60px;cursor:pointer;background:#6b5a36;color:#fff}
.who button:active{background:#85703f}.who button:disabled{opacity:.35}
.who .sam{grid-column:1/-1;background:#8a4b2c}.who .sam:active{background:#a35a36}.who .sam small{display:block;font:600 13px Nunito;opacity:.85}
.persons{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.person{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ph b{font-size:19px}.ph .num{font-family:"Patrick Hand";font-size:34px;color:var(--gold);line-height:1}
.pi{margin:4px 0 6px;font-size:14px;color:var(--ink);min-height:1.4em}
.pp{margin:0 0 6px;font-size:13px;color:var(--mut)}
.armed{background:var(--gold)!important;color:#1d2224!important}
.kpi.fk{border-color:#6b5a36;background:#3f3626}
.fq{display:block;font-size:12px;color:var(--gold);font-weight:600}
tr.fr td:nth-child(4){color:var(--gold)}
.hours{display:grid;gap:8px}
.hr{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:start}
.ht{font-weight:800;padding-top:2px}
.hb{display:grid;gap:3px}
.hbar{height:14px;border-radius:7px;background:var(--red);min-width:4px}
.hv{font-size:14px;font-weight:700}
.htop{font-size:13px;color:var(--mut)}
@media(max-width:600px){.hr{grid-template-columns:74px minmax(0,1fr)}}
.tile.grp .vc{font-size:13px;color:var(--mut);font-weight:700;margin-top:2px}
.vars{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0 14px}
.var{position:relative;font:inherit;text-align:left;border:0;border-radius:16px;background:var(--tile);color:var(--ink);min-height:92px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;cursor:pointer;box-shadow:0 3px 0 #0006}
.var:active{transform:translateY(2px);filter:brightness(1.25)}
.var b{font-size:19px;line-height:1.2}.var .num{color:var(--gold);font-weight:800;font-size:18px;white-space:normal}.var small{color:var(--mut);font-size:12px;font-weight:600}
.var.heiss{background:#4a2723}.var.frei{background:#24443a}.var.poff{background:#3f3626}.var.herz{background:#45301f}
.var .q{position:absolute;top:-6px;right:-6px;min-width:28px;height:28px;border-radius:14px;background:var(--red2);color:#fff;font-weight:800;display:grid;place-items:center;padding:0 8px}
.vclose{width:100%;background:transparent;border:1px solid var(--line)}
.modal{max-height:calc(100vh - 32px);overflow:auto}
.catrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));column-gap:10px;align-items:end}
.pdfb{background:var(--gold);color:#1d2224;border-radius:22px}
.imp td{background:#22324a}.imp td:first-child{box-shadow:inset 4px 0 0 #6aa2ff}
.ib{display:inline-block;font-size:12px;font-weight:800;color:#0e1a2c;background:#8cb8ff;border-radius:8px;padding:1px 7px;vertical-align:1px;white-space:nowrap}
.repov{position:fixed;inset:0;background:#000c;z-index:25;display:flex;flex-direction:column}
.repbar{display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top) + 28px) 14px 12px;background:var(--board);border-bottom:1px solid var(--line)}
.repbar b{flex:1;font-size:17px}
.repbar .btn{min-height:48px;padding:0 20px}
.repend{display:flex;gap:10px;justify-content:center;max-width:820px;margin:16px auto 40px}.repend .btn{min-height:56px;flex:1;max-width:300px}
.repscroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:16px}
.paper{background:#fff;color:#111;max-width:820px;margin:0 auto;border-radius:6px;padding:28px 30px;font:14px/1.4 Helvetica,Arial,sans-serif;-webkit-user-select:text;user-select:text}
.paper h1{font:700 24px Helvetica,Arial,sans-serif;margin:0 0 4px}.paper .sub{color:#666;margin:0 0 16px}
.paper h3{font:700 16px Helvetica,Arial,sans-serif;margin:18px 0 6px}
.paper table{border-collapse:collapse;width:100%;font-size:13.5px}.paper th{background:#2f6b4f;color:#fff;text-align:left;font-weight:700;font-size:12.5px}
.paper th,.paper td{border:1px solid #ccc;padding:5px 7px;color:#111}.paper td.r,.paper th.r{text-align:right}.paper tfoot td{background:#eee;font-weight:700}
.paper .kp{max-width:420px}
/* Preise */
.ptab input,.ptab select{font:inherit;font-size:16px;background:var(--tile);color:var(--ink);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 10px;width:100%}
.ptab .pr{max-width:110px;text-align:right}
.ptab td{padding:5px 4px}
.note{color:var(--mut);font-size:14px;margin:6px 0 12px}
.flag{color:var(--gold);font-weight:800}
@media(max-width:900px){
  .pos{grid-template-columns:minmax(0,1fr)}
  .cart{position:static;max-height:none}
  .cols{grid-template-columns:minmax(0,1fr)}
}
@media(min-width:901px){.mobbar{display:none!important}}
.mobbar{position:fixed;left:0;right:0;bottom:0;background:var(--board);border-top:2px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;z-index:6}
.mobbar .num{font-family:"Patrick Hand";font-size:34px;flex:1}
.mobbar button{min-height:50px}
.mobbar.hide{display:none}
@media(max-width:600px){
  header h1{font-size:24px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile{min-height:88px}
  table{font-size:14px}
  .stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px dashed var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;color:var(--mut);font-size:13px}
}
@media(prefers-reduced-motion:reduce){.toast,.tile{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Glühwein <span>&amp;</span> Gulasch · Kasse</h1>
  <div class="sync" id="sync"><i></i><span>Lädt …</span></div>
  <nav>
    <button data-v="kasse" aria-current="true">Kasse</button>
    <button data-v="frei">Ausgeben</button>
    <button data-v="stats">Auswertung</button>
    <button data-v="preise">Preise</button>
  </nav>
</header>
<main>
  <div class="hint" id="hint" hidden><p>Für den Offline-Betrieb: in Safari auf <b>Teilen</b> tippen, dann <b>Zum Home-Bildschirm</b>. Danach startet die Kasse auch ohne Internet.</p><button class="btn sm" data-hint>OK</button></div>
  <section class="view on" id="v-kasse">
    <div class="pos">
      <div id="menu"></div>
      <aside class="cart" id="cart">
        <div class="ret" id="ret"></div>
        <div class="lines" id="lines"></div>
        <div class="sum" id="sum"></div>
      </aside>
    </div>
  </section>
  <section class="view" id="v-stats"></section>
  <section class="view" id="v-preise"></section>
</main>
<div class="mobbar hide" id="mobbar"><span class="num" id="mobtot">0,00 €</span><button class="btn" id="mobgo">Zur Rechnung ↓</button></div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"><span id="tmsg"></span><button class="btn sm" id="tundo">Rückgängig</button></div>

<script>
{
const LS='wmkasse-v1',APPV='12';
const DEF={
  people:['Kim','Marco','Sarah','Andrea'],
  pv:1,pfand:{tasse:{n:'Tasse',v:200},brett:{n:'Brett',v:1500},flasche:{n:'Flasche',v:50}},
  cats:[{id:'heiss',n:'Heißgetränke'},{id:'schnaps',n:'Feuerwasser'},{id:'frei',n:'Alkoholfrei'},{id:'poff',n:'Poffertjes (12 Stück)'},{id:'herz',n:'Herzhaft'}],
  items:[
    {id:'aperol',n:'Hot Aperol',cat:'heiss',p:450,pf:'tasse'},
    {id:'lum',n:'Lumumba',cat:'heiss',p:450,pf:'tasse'},
    {id:'apfel',n:'Heißer Apfelwein',cat:'heiss',p:300,pf:'tasse'},
    {id:'gluh',n:'Glühwein',cat:'heiss',p:300,pf:'tasse',g:'Glühwein',vn:'Ohne Schuss'},
    {id:'gluh_s',n:'Glühwein mit Schuss',cat:'heiss',p:400,pf:'tasse',g:'Glühwein',vn:'Mit Schuss'},
    {id:'birne',n:'Williams Birne',cat:'schnaps',p:200,pf:''},

function calc(){
  const F=isF(),P=!F||freePf,c=cart(),lines=[],pfOut=zero(),pfIn=zero();let sub=0;
  for(const [id,q] of Object.entries(c.l)){const it=item(id);if(!it||q<=0)continue;lines.push({id,n:it.n,cat:it.cat,p:it.p,q});sub+=it.p*q;if(P&&it.pf&&pfOut[it.pf]!=null)pfOut[it.pf]+=q}
  if(!F)for(const k of PFK)pfIn[k]=c.r[k]||0;
  let pf=0;for(const k of PFK)pf+=(pfOut[k]-pfIn[k])*menu.pfand[k].v;
  return{lines,pfOut,pfIn,sub,pf,total:sub+pf,empty:!lines.length&&!PFK.some(k=>pfIn[k])};
}

function tileHtml(i,its,seen,c,F){
      const grp=i.g?its.filter(x=>x.g===i.g):[i];
      if(grp.length>1){if(seen.has(i.g))return'';seen.add(i.g);
        const ps=grp.map(x=>x.p),lo=Math.min(...ps),hi=Math.max(...ps),q=grp.reduce((a,x)=>a+(c.l[x.id]||0),0),pf=grp.find(x=>x.pf);
        return`<button class="tile grp ${esc(i.cat)}" data-grp="${esc(i.g)}"><b>${esc(i.g)}</b><span class="vc">${grp.length} Sorten ▸</span><span class="p"><span class="num">${lo===hi?fmt(lo):'ab '+fmt(lo)}</span>${pf&&(!F||freePf)?`<small>+ ${esc(pl(pf.pf))}</small>`:''}</span>${q?`<span class="q">${q}</span>`:''}</button>`}
      const q=c.l[i.id]||0;
      return`<button class="tile ${esc(i.cat)}" data-add="${esc(i.id)}"><b>${esc(i.n)}</b>${i.chk&&!F?'<span class="warn">Preis prüfen</span>':''}<span class="p"><span class="num">${fmt(i.p)}</span>${i.pf&&(!F||freePf)?`<small>+ ${esc(pl(i.pf))}</small>`:''}</span>${q?`<span class="q">${q}</span>`:''}</button>`}
const catHtml=(b,span)=>`<div class="cat"${span?` style="grid-column:span ${span}"`:''}><h2>${esc(b.ct.n)}</h2><div class="tiles"${span?` style="grid-template-columns:repeat(${span},minmax(0,1fr))"`:''}>${b.t.join('')}</div></div>`;

  const blocks=menu.cats.map(ct=>{const its=menu.items.filter(i=>i.cat===ct.id),seen=new Set();return{ct,t:its.map(i=>tileHtml(i,its,seen,c,F)).filter(Boolean)}}).filter(b=>b.t.length);
  let h='',row=[],rn=0;
  const flush=()=>{if(row.length===1)h+=catHtml(row[0]);else if(row.length)h+=`<div class="catrow">${row.map(b=>catHtml(b,b.t.length)).join('')}</div>`;row=[];rn=0};
  for(const b of blocks){const n=b.t.length;if(n<=2&&rn+n<=4){row.push(b);rn+=n}else{flush();if(n<=2){row.push(b);rn=n}else h+=catHtml(b)}}
  flush();
  $('menu').innerHTML=(F?`<div class="fbanner"><b>Ausgeben</b> – die Getränke werden nicht kassiert. Artikel antippen, dann rechts wählen, wer ausgibt. Pfand kannst du rechts trotzdem kassieren. Abgerechnet wird später in der Auswertung.</div>`:'')+h;
}

  return{id,ts,u:ts,day:dayKey(ts),lines:c.lines,pfOut:c.pfOut,pfIn:c.pfIn,sub:c.sub,pf:c.pf,total:c.total,pay,void:false,dev:myDev,...(extra||{})}}

  const a=newRec({...c,lines:half},'frei',{by:'Sarah',paid:'',sub:sS,total:sS,sam:1});
  const b=newRec({...c,lines:half.map(l=>({...l})),pfOut:zero(),pfIn:zero(),pf:0},'frei',{by:'Marco',paid:'',sub:sM,total:sM,pf:0,sam:1});
  b.id=a.id+'m';store(a);store(b);save();flush();resetCart();closeModal();renderKasse();setSync();
  toast(`Samco gibt aus · Sarah ${fmt(sS)}, Marco ${fmt(sM)}`+(c.pf?` · ${fmt(c.pf)} Pfand bar kassiert`:''),()=>{voidSale(a.id);voidSale(b.id);toast('Storniert')});}

async function flush(){
  if(!db){pending.clear();save();return}
  if(flushing)return;flushing=true;
  try{for(const id of [...pending]){const r=sales[id];if(!r){pending.delete(id);continue}
    await db.collection('sales').doc(id).set(clone(r));pending.delete(id);save()}}
  catch(e){setTimeout(flush,15000)}
  flushing=false;setSync();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.v){setView(d.v);return}
  if(d.grp){openVar(d.grp);return}

  if('repclose' in d){closeReport();return}

  if(d.add){const c=cart();c.l[d.add]=(c.l[d.add]||0)+1;hist.push(['l',d.add]);renderKasse();return}
  if(d.dec){decL(d.dec);renderKasse();return}
  if(d.rm){delete cart().l[d.rm];renderKasse();return}
  if(d.ret){const c=cart();c.r[d.ret]=(c.r[d.ret]||0)+1;hist.push(['r',d.ret]);renderCart();return}
  if(d.rdec){decR(d.rdec);renderCart();return}
  if(d.rrm){delete cart().r[d.rrm];renderCart();return}
  if('undo' in d){const c=cart();while(hist.length){const [t,k]=hist.pop();if(t==='l'&&c.l[k]){decL(k);break}if(t==='r'&&c.r[k]){decR(k);break}}renderKasse();return}
  if('clear' in d){resetCart();renderKasse();return}
  if(d.giver){giveOut(d.giver);return}
  if('samco' in d){giveSamco();return}
  if('pft' in d){freePf=!freePf;save();renderKasse();return}
  if(d.pay==='karte'){openCard();return}
  if('cardok' in d){finalize('karte');return}
  if('tobar' in d){openPay();return}
  if(d.pay==='bar'){openPay();return}
  if('close' in d){closeModal();return}
  if('book' in d){finalize('bar');return}
  if('exact' in d){given=calc().total;updGiven();return}
  if(d.note){given+=+d.note;updGiven();return}
  if('greset' in d){given=0;updGiven();return}
  if(d.day){dayF=d.day;renderStats();return}
  if(d.void){voidSale(d.void,!sales[d.void].void);return}
  if(d.settle){settle(d.settle,d.how);return}
  if('copy' in d){copyCsv(b);return}
  if('wipe' in d){wipe(b);return}
  if('share' in d){shareData(b);return}
  if('imp' in d){mergeIn($('imp').value);return}
  if('hint' in d){hintOff=true;save();$('hint').hidden=true;return}
  if(d.del){menu.items=menu.items.filter(i=>i.id!==d.del);renderPreise();return}

  if('upd' in d){b.textContent='Prüfe …';(async()=>{try{const r=await navigator.serviceWorker?.getRegistration();if(r)await r.update()}catch(e){}location.reload()})();return}
  if('defp' in d){menu=clone(DEF);renderPreise();return}
});

function freeBy(){const m={};for(const n of people())m[n]={n,open:0,paid:0,items:{},ids:[]};
  for(const r of Object.values(sales)){if(r.void||!isFree(r))continue;const p=m[r.by]||(m[r.by]={n:r.by,open:0,paid:0,items:{},ids:[]});

const N=x=>{x=Number(x);return Number.isFinite(x)?Math.round(x):0};
const NQ=x=>{x=Number(x);return Number.isFinite(x)?Math.round(x*2)/2:0};
function cleanRec(r){if(!r||typeof r!=='object'||!r.id||!Array.isArray(r.lines))return null;
  const ts=N(r.ts)||Date.now(),pf=o=>{const x={};for(const k of PFK)x[k]=N(o&&o[k]);return x};
  const pay=r.pay==='karte'?'karte':r.pay==='frei'?'frei':'bar';
  const o={id:String(r.id).slice(0,40),ts,u:N(r.u)||ts,day:/^\d{4}-\d\d-\d\d$/.test(r.day)?r.day:dayKey(ts),
    lines:r.lines.map(l=>({id:String(l&&l.id||''),n:String(l&&l.n||'?').slice(0,80),cat:String(l&&l.cat||''),p:N(l&&l.p),q:NQ(l&&l.q)})),
    pfOut:pf(r.pfOut),pfIn:pf(r.pfIn),sub:N(r.sub),pf:N(r.pf),total:N(r.total),pay,void:!!r.void};
  if(r.dev)o.dev=String(r.dev).slice(0,12);
  if(pay==='frei'){o.by=String(r.by||'?').slice(0,30);o.paid=r.paid==='karte'?'karte':r.paid==='bar'?'bar':'';o.paidTs=N(r.paidTs);if(r.sam)o.sam=1}
  return o;}
function mergeIn(txt){let o;try{o=JSON.parse(txt)}catch(e){toast('Das sind keine Kassen-Daten');return}
  if(!o||o.app!=='wmkasse'||!o.sales||typeof o.sales!=='object'){toast('Das sind keine Kassen-Daten');return}
  let add=0,chg=0;
  for(const raw of Object.values(o.sales)){const r=cleanRec(raw);if(!r)continue;const l=sales[r.id];
    if(!l){store(r);if(r.dev!==myDev)imported.add(r.id);add++}else if(upd(r)>upd(l)){store(r);chg++}}
  const m=o.menu;
  if(m&&Array.isArray(m.items)&&Array.isArray(m.cats)&&m.pfand&&PFK.every(k=>m.pfand[k]&&Number.isFinite(+m.pfand[k].v))&&N(o.menuU)>menuU){
    menu=clone(m);if(m.people&&!Array.isArray(m.people))delete menu.people;menuU=N(o.menuU);if(db)db.doc('config/menu').set(clone(menu)).catch(()=>{})}
  save();flush();setSync();renderAll();toast(`${add} neue, ${chg} geänderte Buchungen übernommen`);
}

function hoursOf(recs){const H={};for(const r of recs){if(r.void)continue;const h=new Date(r.ts).getHours(),x=H[h]||(H[h]={h,sub:0,n:0,free:0});if(isFree(r))x.free+=r.sub;else{x.sub+=r.sub;x.n++}}return Object.values(H).sort((a,b)=>a.h-b.h)}

    pf:PFK.map(k=>[menu.pfand[k].n,String(s.out[k]),String(s.in[k]),String(s.out[k]-s.in[k]),P((s.out[k]-s.in[k])*menu.pfand[k].v)]),

function stats(){
  const recs=Object.values(sales).filter(r=>dayF==='all'||r.day===dayF);
  const live=recs.filter(r=>!r.void);
  const s={n:0,sub:0,bar:0,karte:0,open:0,freeV:0,out:zero(),in:zero(),items:{}};
  for(const r of live){
    for(const l of r.lines){const x=s.items[l.n]||(s.items[l.n]={n:l.n,q:0,u:0,f:0});x.q+=l.q;if(isFree(r)&&!r.paid)x.f+=l.q;else x.u+=l.p*l.q}
    if(isFree(r)){s.freeV+=r.sub;if(r.paid){s.sub+=r.sub;s[r.paid]+=r.sub}else s.open+=r.sub;if(r.pf){s.bar+=r.pf;for(const k of PFK)s.out[k]+=r.pfOut?.[k]||0}continue}
    s.n++;s.sub+=r.sub;s[r.pay==='karte'?'karte':'bar']+=r.total;for(const k of PFK){s.out[k]+=r.pfOut?.[k]||0;s.in[k]+=r.pfIn?.[k]||0}}
  return{s,recs};

  const {s}=stats();const rows=[['Artikel','Menge','davon ausgegeben (offen)','Umsatz']];
  for(const i of Object.values(s.items).sort((a,b)=>b.q-a.q))rows.push([i.n,String(i.q).replace('.',','),String(i.f).replace('.',','),(i.u/100).toFixed(2).replace('.',',')]);
  rows.push([],['Person','Offen','Bezahlt']);for(const p of freeBy())rows.push([p.n,(p.open/100).toFixed(2).replace('.',','),(p.paid/100).toFixed(2).replace('.',',')]);
  rows.push([],['Zeit','Tag','Zahlung','Waren','Pfand','Gesamt','Storniert','Inhalt']);
  for(const r of Object.values(sales).sort((a,b)=>a.ts-b.ts))rows.push([new Date(r.ts).toLocaleString('de-DE'),r.day,isFree(r)?'ausgegeben: '+r.by+(r.paid?' (bezahlt '+r.paid+')':' (offen)'):r.pay,(r.sub/100).toFixed(2).replace('.',','),(r.pf/100).toFixed(2).replace('.',','),(r.total/100).toFixed(2).replace('.',','),r.void?'ja':'',r.lines.map(l=>l.q+'x '+l.n).join(' / ')]);
  const txt=rows.map(r=>r.join('\t')).join('\n');
  navigator.clipboard.writeText(txt).then(()=>{b.textContent='Kopiert ✓'},()=>{b.textContent='Kopieren nicht erlaubt'});
}
async function wipe(b){
  if(!wipeArm){wipeArm=1;renderStats();setTimeout(()=>{wipeArm=0;if(view==='stats')renderStats()},4000);return}
  wipeArm=0;const ids=Object.keys(sales);sales={};pending.clear();lastSync=0;save();renderAll();setSync();toast('Alle Buchungen gelöscht');
  if(db)for(const id of ids){try{await db.collection('sales').doc(id).delete()}catch(e){}}
}

/* Preise */
function renderPreise(){
  const catO=v=>menu.cats.map(c=>`<option value="${esc(c.id)}" ${c.id===v?'selected':''}>${esc(c.n)}</option>`).join('');
  const pfO=v=>`<option value="">kein Pfand</option>`+PFK.map(k=>`<option value="${k}" ${k===v?'selected':''}>${esc(pl(k))}</option>`).join('');
  $('v-preise').innerHTML=`<div class="card ptab"><h2>Wer darf ausgeben?</h2><p class="note">Namen mit Komma trennen. Erscheinen im Reiter „Ausgeben“ als Knöpfe.</p><input id="ppl" value="${esc(people().join(', '))}" aria-label="Namen"></div>
  <div class="card ptab"><h2>Pfand</h2><table><tbody>${PFK.map(k=>`<tr><td>${esc(pl(k))}</td><td><input class="pr" inputmode="decimal" data-pfv="${k}" value="${(menu.pfand[k].v/100).toFixed(2).replace('.',',')}"></td></tr>`).join('')}</tbody></table></div>
  <div class="card ptab"><h2>Artikel &amp; Preise</h2><p class="note"><span class="flag">Gelb markiert</span> = Preis stand nicht auf der Tafel, bitte prüfen. Speichern entfernt die Markierung. Geänderte Preise gehen beim nächsten Abgleich mit auf die anderen Geräte.<br><b>Kachel:</b> Artikel mit gleichem Kachel-Namen werden zu einer Kachel mit Sorten-Auswahl zusammengefasst (z. B. „Poffertjes“). Leer lassen = eigene Kachel. <b>Sorte:</b> der Text im Auswahlfenster.</p>
  <table class="stack"><thead><tr><th>Name</th><th>Preis €</th><th>Pfand</th><th>Kategorie</th><th>Kachel</th><th>Sorte</th><th></th></tr></thead><tbody>${menu.items.map(i=>`<tr data-id="${esc(i.id)}"><td data-l="Name"><input data-f="n" value="${esc(i.n)}"></td><td data-l="Preis €"><input class="pr" data-f="p" inputmode="decimal" value="${(i.p/100).toFixed(2).replace('.',',')}" ${i.chk?'style="border-color:var(--gold);color:var(--gold)"':''}></td><td data-l="Pfand"><select data-f="pf">${pfO(i.pf)}</select></td><td data-l="Kategorie"><select data-f="cat">${catO(i.cat)}</select></td><td data-l="Kachel"><input data-f="g" value="${esc(i.g||'')}" placeholder="eigene Kachel"></td><td data-l="Sorte"><input data-f="vn" value="${esc(i.vn||'')}" placeholder="–"></td><td><button class="btn sm danger" data-del="${esc(i.id)}">Entfernen</button></td></tr>`).join('')}</tbody></table>
  <div class="tools" style="margin-top:12px"><button class="btn" data-addi>+ Artikel</button><button class="btn" style="background:var(--pine);color:#fff" data-savep>Speichern</button><button class="btn" data-defp>Standard laden</button></div></div>
  <div class="card"><h2>App</h2><p class="note">Version ${APPV}. Mit Internet holt sich die App neue Versionen automatisch beim Öffnen.</p><button class="btn" data-upd>Jetzt auf Update prüfen</button></div>`;
}
const num=v=>Math.round(parseFloat(String(v).replace(',','.'))*100)||0;
async function savePrices(b){
  for(const k of PFK){const el=document.querySelector(`[data-pfv="${k}"]`);if(el)menu.pfand[k].v=num(el.value)}
  const pp=$('ppl');if(pp){const ns=[...new Set(pp.value.split(',').map(x=>x.trim().slice(0,30)).filter(Boolean))];menu.people=ns.length?ns:clone(DEF.people)}
  document.querySelectorAll('#v-preise tr[data-id]').forEach(tr=>{const it=item(tr.dataset.id);if(!it)return;
    tr.querySelectorAll('[data-f]').forEach(f=>{const k=f.dataset.f;it[k]=k==='p'?num(f.value):f.value});delete it.chk});
  menuU=Date.now();save();renderPreise();
  if(db){try{await db.doc('config/menu').set(clone(menu));toast('Preise gespeichert')}catch(e){toast('Lokal gespeichert, online fehlgeschlagen')}}else toast('Preise gespeichert');
}

function renderAll(){if(view==='kasse'||view==='frei')renderKasse();if(view==='stats')renderStats();if(view==='preise'&&!document.activeElement?.closest('#v-preise'))renderPreise();if(view!=='kasse'&&view!=='frei')renderCart()}

load();migrate(menu);save();if(!myDev){myDev=Math.random().toString(36).slice(2,10);save()}renderKasse();setSync();
if(!inFrame&&!STANDALONE&&!hintOff&&/iPad|iPhone|Macintosh/.test(navigator.userAgent)&&'ontouchend' in document)$('hint').hidden=false;
if(!inFrame&&'serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
(async()=>{
  try{db=window.claude?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){setSync();return}
  setSync();
  const timer=setTimeout(()=>{online=false;setSync()},10000);
  db.collection('sales').onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer);online=true}
    for(const d of snap.docs){const r=d.data();if(r&&r.id&&!pending.has(r.id))sales[r.id]=clone(r)}
    for(const ch of snap.docChanges())if(ch.type==='removed'&&!pending.has(ch.doc.id))delete sales[ch.doc.id];
    save();setSync();if(view!=='kasse'&&view!=='frei')renderAll();flush();
  },()=>{online=false;setSync()});
  db.doc('config/menu').onSnapshot(s=>{if(s.exists){const m=s.data();if(m&&Array.isArray(m.items)){menu=migrate(clone(m));save();renderAll()}}},()=>{});
  flush();
})();
}
